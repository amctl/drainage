name: groundwork_flutter
description: Groundwork community drainage watch, ported to Flutter Web.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  supabase_flutter: ^2.10.3
  mapbox_maps_flutter: ^3.35.2
  file_picker: ^10.3.7
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/wards_delhi.geojson
